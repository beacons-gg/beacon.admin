# Release: run this on main with a version to ship the operator plugin contract.
#
#   gh workflow run release.yml -f version=1.0.1     (or Actions > Release > Run workflow, on main)
#   gh workflow run release.yml -f version=2.0.0-rc.1   (a release candidate: see step 4)
#
# Merging to main validates and ships nothing (ci.yml). A release is this one run, in order:
#
#   1. Version.  @beaconsgg/admin-plugin, the one package this repository publishes, is set to the
#                version given. The contract has a version of its own (beacon.core's
#                doc/core-compatibility.md §8): a breaking change is a major, an addition a minor
#                and a fix a patch. A major of core's packages is a major of the contract.
#                A major or a deprecation needs its entry in CHANGELOG.md first (§9).
#   2. Gate.     The whole gate on the tree about to ship.
#   3. Record.   The commit "Release <version>" is pushed to main. If main moved since the run
#                started, the push is refused and nothing has shipped yet: run it again.
#   4. Publish.  Builds the contract and puts it up if the registry lacks that version, then points
#                `latest` at what main names. A prerelease (2.0.0-rc.1) goes up under the `next`
#                tag instead, and `latest` stays where it was. A package's very first publish is
#                also its `latest` on the registry, whatever the tag, until a release replaces it.
#   5. Image.    The `image` job builds the console's image (Dockerfile), with no game plugin,
#                and pushes it to GitHub Container Registry as beacon-admin:<version> and :latest.
#                A prerelease's image is pushed as beacon-admin:<version> only.
#   6. List.     The tag `v<version>` at that commit and a GitHub Release on it, with notes
#                generated from the pull requests merged since the previous release. Last, so a
#                listed version always has its package and its image. A prerelease's GitHub
#                Release is marked as a prerelease. What a plugin has to change is in CHANGELOG.md.
#
# Every step is safe to repeat: a re-run with the same version finishes what is missing and changes
# nothing that is already there (the version is then already main's, so step 1 moves nothing; an
# image push is a re-push of the same content).
#
# The console itself (@beaconsgg/admin) is private and never goes up as a package: the image is how
# it ships. The package half is the same workflow as beacons-gg/beacon.core's, for one package.
#
# Needs the NPM_TOKEN repository secret (the registry). The image job runs in the
# `release` GitHub Environment, the home for ship-time configuration, as the server's does:
#   The image carries no game plugin: the build's CONSOLE_PLUGINS argument is empty. An operator
#   who wants one builds their own image with it (apps/admin/README.md, "Game plugins").
#   The image job pushes to ghcr.io/beacons-gg/beacon-admin with the workflow's own token
#   (`packages: write`), so it needs no registry secret.
# The workflow's own token pushes the commit, the tag and the release; its push starts no CI run,
# which is right: the gate ran here on that exact tree. The tag is created by git push at the head
# of main, where the workflow token is allowed to create it (a ref at an older commit whose
# workflow files differ from main's is refused). The order when a change spans repositories is
# Beacon's doc/release-runbook.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to release (1.0.1, or 2.0.0-rc.1 for a release candidate). A breaking change
          is a major, an addition a minor and a fix a patch.
        required: true

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the version commit, the tag and the GitHub Release

env:
  TURBO_TELEMETRY_DISABLED: 1
  REGISTRY: https://registry.npmjs.org/
  # What this repository publishes, as a filter for turbo and pnpm.
  PUBLISHED: --filter=./packages/admin/*

jobs:
  publish:
    # Version, gate, record, publish: the package half.
    runs-on: ${{ fromJSON(vars.BEACON_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      sha: ${{ steps.record.outputs.sha }} # the commit being released
    steps:
      # Releases ship from main, full stop.
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release is cut from main, not ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for "is this version released already"

      - uses: ./.github/actions/setup-workspace
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      # The input is user-typed text: checked for shape before anything reads it. It has to be
      # main's version (a re-run) or a later one; a tag that exists means the release is done.
      - name: Check the version
        run: |
          # A prerelease is semver's: dot-separated identifiers, none empty, and a numeric one has no
          # leading zero. pnpm refuses anything else at publish, after the version commit is on main.
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?$ ]]; then
            echo "::error::version '$VERSION' is not of the form 1.0.1 or 2.0.0-rc.1"; exit 1
          fi
          current=$(jq -r .version packages/admin/plugin/package.json)
          # Semver order, where a release ranks above its own candidates (2.0.0 > 2.0.0-rc.2).
          node -e '
            const parse = (v) => { const [core, pre] = v.split(/-(.*)/s); return [core.split(".").map(Number), pre ? pre.split(".") : []]; };
            const part = (x, y) => { const nx = /^\d+$/.test(x), ny = /^\d+$/.test(y); return nx && ny ? Number(x) - Number(y) : nx ? -1 : ny ? 1 : x < y ? -1 : x > y ? 1 : 0; };
            const cmp = (a, b) => {
              const [ca, pa] = parse(a), [cb, pb] = parse(b);
              for (let i = 0; i < 3; i++) if (ca[i] !== cb[i]) return ca[i] - cb[i];
              if (!pa.length || !pb.length) return pb.length - pa.length;
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                if (pa[i] === undefined) return -1;
                if (pb[i] === undefined) return 1;
                const d = part(pa[i], pb[i]); if (d) return d;
              }
              return 0;
            };
            if (cmp(process.argv[1], process.argv[2]) < 0) { console.log("::error::version " + process.argv[1] + " is below the version main names, " + process.argv[2]); process.exit(1); }
          ' "$VERSION" "$current"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is released already (the tag exists); a re-run is for a release that did not finish, which has no tag yet"; exit 1
          fi
          echo "releasing $VERSION (main names $current)"

      - name: Set the version on what is published
        run: |
          for dir in $(pnpm -r ls --depth -1 --json $PUBLISHED | jq -r '.[] | select(.private != true) | .path'); do
            jq --arg v "$VERSION" '.version = $v' "$dir/package.json" > "$dir/package.json.tmp"
            mv "$dir/package.json.tmp" "$dir/package.json"
          done
          pnpm exec prettier --write 'packages/*/*/package.json' >/dev/null
          git --no-pager diff --stat

      - name: The whole gate, on the tree about to ship
        run: pnpm run gate

      # The record goes to main before anything is published, so that a publish that fails halfway
      # leaves main naming a version the registry lacks, which a re-run puts up: never the other
      # way round.
      - name: Push the version commit to main
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "main names $VERSION already: nothing to commit (a re-run)"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release $VERSION"
          git push origin HEAD:main

      - id: record
        name: The commit being released
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # `files` is dist, so the contract is built first; the console is not.
      - name: Build what is published
        run: pnpm exec turbo run build $PUBLISHED

      # pnpm's recursive publish puts up every public package whose version the registry lacks and
      # skips the rest, so a re-run finishes a release that did not go up. It rewrites `catalog:`
      # ranges to the resolved versions on the way out. A prerelease goes up under `next`.
      - name: Publish what the registry lacks
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          pnpm -r publish $PUBLISHED --no-git-checks --tag "$tag"

      # The manifest names a version the registry has, from before this run or from the step above,
      # so this is idempotent, and it ends any state where `latest` points at an older build than
      # main names. A prerelease leaves `latest` where it was.
      - name: Point latest at what main names
        if: ${{ !contains(env.VERSION, '-') }}
        run: |
          specs=$(pnpm -r ls --depth -1 --json $PUBLISHED \
            | jq -r '.[] | select(.private != true) | "\(.name)@\(.version)"')
          for spec in $specs; do
            npm dist-tag add "$spec" latest --registry "$REGISTRY"
          done

  image:
    # The console's image, from the released commit, pushed as <version> and latest. The deploy
    # artifact (README, "Deploying the console").
    needs: publish
    runs-on: ${{ fromJSON(vars.BEACON_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile mounts an npm user config as a build secret. Public npm needs no token and
      # the image installs no plugin, so the file is empty.
      - name: An empty npm config for the build secret
        run: touch "$RUNNER_TEMP/npmrc"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/beacons-gg/beacon-admin
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}

      - name: Build + push beacon-admin
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: npmrc=${{ runner.temp }}/npmrc
          # The public image carries no game plugin.
          build-args: CONSOLE_PLUGINS=
          cache-from: type=gha,scope=beacon-admin
          cache-to: type=gha,mode=max,scope=beacon-admin

      - name: Note the image in the summary
        env:
          IMAGE: ghcr.io/beacons-gg/beacon-admin
        run: |
          also=", also latest"
          case "$VERSION" in *-*) also="" ;; esac
          echo "- image $IMAGE:$VERSION$also" >> "$GITHUB_STEP_SUMMARY"

  list:
    # The record, written last: the tag at the released commit and the GitHub Release. If the
    # publish or the image failed, this never runs and no tag exists; the re-run with the same
    # version finishes what is missing. The notes are the pull requests merged since the previous
    # release (`v*`). CHANGELOG.md adds what a plugin has to do, for a major or a deprecation.
    needs: [publish, image]
    runs-on: ${{ fromJSON(vars.BEACON_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0

      - name: Tag and list the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" --verify-tag --title "$VERSION" --generate-notes $prerelease
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          echo "released v$VERSION: $url"
          echo "### Released v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
