# Minutes are spent with care: a draft pull request runs nothing, so work is pushed as a draft, the
# gate is run locally (`pnpm run gate`), and the request is marked ready once, for one run. A push
# to main runs nothing either: a merge lands what its pull request's run validated.
#
# CI: the whole gate on every pull request marked ready. This repository is small enough to run
# everything every time, so there is no affected-scoping and nothing a skipped job could hide. No
# database: the console is a static Next app over signed requests to servers the operator enters at
# runtime.
#
# The Beacon packages (@beaconsgg/*) install from the public npm registry and need no token.
# The repository lists no game plugin, so both jobs prove the console builds, typechecks and passes
# its suites with none (a deployment adds its plugins at build time: apps/admin/README.md, "Game
# plugins").
#
# The second job proves the deployable shape: the console's image builds (Dockerfile), with the
# registry token as a BuildKit secret, never a layer. It is not pushed here.
#
# Releasing is deliberately NOT here: merging to main validates. A release is the Release workflow,
# run by hand on main with a version (release.yml).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push to a ready PR cancels the older run. A ready_for_review event can arrive twice, once
# still marked draft; a draft run does nothing and must not cancel the real one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.BEACON_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      # The presets' checks, the public-API list, the one-copy check, build + typecheck (Next's
      # build included), the suites with their coverage floors, lint and the format check:
      # package.json > scripts.gate.
      - run: pnpm run gate

  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # The image stays buildable: the deploy artifact (README, "Deploying the console").
    runs-on: ${{ fromJSON(vars.BEACON_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build beacon-admin
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: beacon-admin:ci
          # Same cache scope as the release push, so a release replays the layers the last PR or
          # main build already proved.
          cache-from: type=gha,scope=beacon-admin
          cache-to: type=gha,mode=max,scope=beacon-admin
