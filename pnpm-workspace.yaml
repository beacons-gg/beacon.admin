packages:
  - "apps/*" # the console (apps/admin)
  - "packages/admin/*" # the plugin contract (@beaconsgg/admin-plugin); the tier is the directory (@beaconsgg/eslint-config)

# One version range per shared dependency; a manifest names it with "catalog:".
catalog:
  zod: ^4.6.7 # a peer of @beaconsgg/protocol-types, so the console declares it (beacon.core's doc/core-compatibility.md §7)
  typescript: ^5.7.3
  "@types/node": ^22.10.0 # the console's config files and one test read the filesystem
  vitest: ^2.1.8
  "@vitest/coverage-v8": ^2.1.8
  eslint: ^9.18.0
  prettier: ^3.4.2
  turbo: ^2.3.3

# Native deps allowed to run their install scripts.
onlyBuiltDependencies:
  - esbuild
